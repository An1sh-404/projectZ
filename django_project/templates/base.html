{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>ProjectZ</title>
  </head>
  <body>
    <div class="bg-violet-300">
      <nav class="flex gap-5 pl-2 p-6 font-bold text-black">
        <ul>
          <a href="{% url 'home' %}">ProjectZ</a>
        </ul>
        <ul>
          <a href="{% url 'signup' %}">Register</a>
        </ul>
        <ul>
          <a href="{% url 'login' %}">Login</a>
        </ul>
      </nav>
    </div>

    {% block content %}
    <div class="mt-20 flex align-middle flex-col gap-11">
      <div>
        <h1 class="text-center text-5xl font-bold">
          ProjectZ....Management at it's finest!
        </h1>
        <h3 class="text-center py-2">
          Keep track of your records effectively.
        </h3>
      </div>
      <div class="flex justify-center">
        <button
          type="submit"
          class="text-center py-2 px-4 bg-violet-700 text-white rounded-lg hover:bg-violet-800 transition"
        >
          <a href="{% url 'signup' %}">Create your account<span>👤</span></a>
        </button>
      </div>
    </div>
    {% endblock content %}
  </body>
</html>
