{% extends 'home.html' %}
{% block title %}
    Delete
{% endblock title %}

{% block content %}
<div class="flex justify-center mt-4 mb-4">
  <div class="border-0.5 bg-gray-200 rounded-2xl p-4 text-gray-700">
    <div class="pb-5">
    
    <h1 class="text-4xl pt-2.5 font-bold ">Are you sure you want to delete?</h1>
    
  </div>
    <form method="post" class="space-y-4">
      {% csrf_token %}
        <button type="submit" class="self-center py-2 px-4 bg-red-500 text-white rounded-lg hover:bg-red-600 transition">
        Delete<span></span>
      </button>
      
      <a href="{% url 'dashboard' %}" class="cursor-pointer"><button type="button" class="self-center py-2 px-4 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">Cancel</button></a>
    </form>

</div>
{% endblock content %}
