{% extends 'home.html' %} 
{% block title %}
  New
{% endblock title %}
{% block content %}
<div class="flex justify-center mt-4 mb-4">
  <div class="border-0.5 bg-gray-200 rounded-2xl p-4 text-gray-700">
    <div class="pb-5">
    
    <h1 class="text-4xl font-bold">Create record</h1>
    <h6 class="font-semibold"> 
      Start adding in the required details for your record.
    </h6>
    
    <hr class="text-gray-400 font-bold "/>
    </div>
    
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="{{form.first_name.id_for_label}}">First name</label>
        <input
          type="text"
          name="first_name"
          placeholder="John"
          
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="{{form.last_name.id_for_label}}">Last name</label>
        <input
          type="text"
          name="last_name"
          placeholder="Doe"
          
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="{{form.email.id_for_label}}">First name</label>
        <input
          type="email"
          name="email"
          placeholder="johnDoe123@gmail.com"
          
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="{{form.phone.id_for_label}}">Phone</label>
        <input
          type="tel"
          name="phone"
          pattern="[0-9]{10}"
          placeholder="1234567890"
        
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="{{form.address.id_for_label}}">Address</label>
        <input
          type="text"
          name="address"
          placeholder="13Street,New York"
          
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="{{form.city.id_for_label}}">City</label>
        <input
          type="text"
          name="city"
          placeholder="New west"
          
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="{{form.province.id_for_label}}">Province</label>
        <input
          type="text"
          name="province"
          placeholder="Western View"
          
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="{{form.country.id_for_label}}">Country</label>
        <input
          type="text"
          name="country"
          placeholder="Hogwarts"
         
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      
      <button type="submit" class="self-center py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
        Create record<span></span>
      </button>
      
      <a href="{% url 'dashboard' %}" class="cursor-pointer"><button type="button" class="self-center py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Return</button></a>
    </form>
  
      
    
    
    
  </div>
</div>
{% endblock content %}
