{% extends 'base.html' %}
{% block content %}
    <div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-4">
      Password Change
    </h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}

        <div>
        <label for="{{form.old_password.id_for_label}}">Old password</label>
        <input
          
          type="password"
          name="old_password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your old password"
        />
      </div>

      <div>
        <label for="{{form.new_password1.id_for_label}}">New password</label>
        <input
          
          name="new_password1"
          type="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter new password"
        />
        <small class="text-gray-500">{{ form.new_password1.help_text }}</small>

      </div>
      
      <div>
        <label for="{{form.new_password2.id_for_label}}">New password confirmation</label>
        <input
          
          name="new_password2"
          type="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter new password again"
        />

      </div>
        <button type="submit" class="w-full py-2 px-4 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                Change my password
        </button>
    </form>
{% endblock content %}
