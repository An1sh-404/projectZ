{% extends 'base.html' %} 

{% block content %}
<div class="mt-5 flex items-center justify-center h-100 bg-gray-100 ">
  <div class="w-full max-w-md bg-white p-6 rounded-3xl shadow-lg h-90">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-4">
      LogIn
    </h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="username">Username</label>
        <input
          type="text"
          name="username"
          id="id_username"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="id_password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

        <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                LogIn 
            </button>
    </form>
     <p class="mt-4 text-center text-gray-600">
            <a href="{% url 'password_reset' %}" class="text-blue-500 hover:underline">Forgot your password?</a>
        </p>
    
  </div>

</div>

{% endblock content %}
